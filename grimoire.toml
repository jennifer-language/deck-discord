# Grimoire book configuration for the @jennifer/discord documentation.

[book]
title = "@jennifer/discord"
description = "Post messages to a Discord channel through a webhook"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "carbon"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://jennifer-language.github.io/deck-discord/"
repoUrl = "https://github.com/jennifer-language/deck-discord"
repoLabel = "Source"
editUrl = "https://github.com/jennifer-language/deck-discord/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
